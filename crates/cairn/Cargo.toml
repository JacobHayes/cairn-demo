[package]
name = "cairn"
description = "The binary: `cairn serve` and its commands, the configuration, the composition root, the embedded web build, the listener, the Host allowlist, and structured logs and metrics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["matched-path"] }
cairn-api.workspace = true
cairn-assistant.workspace = true
cairn-auth.workspace = true
cairn-engine.workspace = true
cairn-schema.workspace = true
cairn-service.workspace = true
cairn-store.workspace = true
cairn-store-turso.workspace = true
# `cairn demo` seeds the fixtures the in-browser host is seeded with.
cairn-wasm.workspace = true
chrono.workspace = true
clap.workspace = true
# `cairn demo`'s stub issuer signs its ID tokens.
ed25519-dalek.workspace = true
# The server reads time zones from the system's database (/usr/share/zoneinfo): the service
# brings no zone database of its own (DeploymentSettings::new).
jiff = { workspace = true, features = ["tz-system", "tzdb-zoneinfo"] }
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
openidconnect.workspace = true
# debug-embed: debug builds embed the web build too, rather than read it at run time from an
# absolute path baked into the compile, which a cached compile can carry from another checkout.
rust-embed = { workspace = true, features = ["debug-embed", "include-exclude"] }
sentry = { version = "0.49.3", default-features = false, features = ["backtrace", "contexts", "panic", "debug-images", "reqwest", "rustls", "tracing", "tower", "tower-http", "tower-axum-matched-path", "logs", "metrics", "release-health"] }
serde.workspace = true
serde_json.workspace = true
socket2.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }

[lints]
workspace = true
