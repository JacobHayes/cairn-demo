[package]
name = "cairn-store-turso"
description = "The Turso store backend: embedded, SQLite file format, MVCC commits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# A test seam: open the store over an I/O implementation the caller supplies
# (`TursoStore::open_with_io`), so a test can fail one fsync
# (decisions/2026-10-09-a-commit-the-store-cannot-settle-fails-it-closed.md). It names
# Turso's engine through `turso`'s own re-export, so the two can never differ in version.
io-seam = []

[dependencies]
cairn-schema.workspace = true
cairn-store.workspace = true
metrics.workspace = true
getrandom.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
turso.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[dev-dependencies]
cairn-store-turso = { workspace = true, features = ["io-seam"] }
cairn-schema = { workspace = true, features = ["testing"] }
cairn-store = { workspace = true, features = ["conformance"] }
patina-dst-proptest.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "test-util", "time"] }

[lints]
workspace = true
