[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.3"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/JacobHayes/cairn"
publish = false

[workspace.dependencies]
cairn-api = { path = "crates/api" }
cairn-assistant = { path = "crates/assistant" }
cairn-auth = { path = "crates/auth" }
cairn-engine = { path = "crates/engine" }
cairn-mcp = { path = "crates/mcp" }
cairn-schema = { path = "crates/schema" }
cairn-service = { path = "crates/service" }
cairn-store = { path = "crates/store" }
cairn-store-turso = { path = "crates/store-turso" }
cairn-wasm = { path = "crates/wasm" }
# The auth crate (ARCHITECTURE, Auth): axum for the layer and the providers' own routes
# (HTTP/1 on tokio, as the spike proved, plus forms, queries, and JSON for the OAuth
# endpoints); base64 for the built-in server's client ids; chrono only for the clock
# openidconnect checks expiry against (and the claims of the demo's stub issuer); cookie for
# the session and sign-in cookies; ed25519-dalek only to sign the ID tokens of `cairn demo`'s
# stub issuer and of the tests; p256 only to sign test IAP
# assertions (already in the tree under openidconnect); getrandom for secrets; subtle to
# compare them in constant time; url for the public base URL; hyper, hyper-util, and
# http-body-util for the one GET to tailscaled's whois over its unix socket (already in the
# tree under axum and reqwest); ipnet for the networks Tailscale's proxy mode trusts (already
# in the tree under reqwest); tower only to drive a router in tests.
base64 = "0.23.1"
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
chrono = { version = "0.4.45", default-features = false }
cookie = "0.18.2"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["pem"] }
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
ipnet = { version = "2.12.2", default-features = false, features = ["std"] }
# The OIDC client (ARCHITECTURE, Auth; PRACTICES names it): discovery, the code exchange
# with PKCE, and ID token verification. Outbound uses the workspace reqwest client
# with rustls, so OIDC and assistant calls share one HTTP client version.
openidconnect = { version = "4.0.1", default-features = false }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
subtle = "2.6.1"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
url = "2.5.8"
# The HTTP API (ARCHITECTURE, HTTP API; Observability): futures-core for the SSE body's
# stream trait (already in the tree under axum); tracing for structured request logs (in
# the tree under turso); metrics, the facade 4.7 attaches an exporter to, for request,
# patch, and panic counts and latencies; metrics-util only to read them back in tests.
futures-core = "0.3.34"
metrics = "0.24.6"
metrics-util = { version = "0.20.4", default-features = false, features = ["debugging"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# The binary (ARCHITECTURE, Build, run, deploy; Observability): clap for its commands; toml
# for the configuration file; rust-embed to embed the web build, with each file's media
# type; socket2 to set TCP_USER_TIMEOUT and keepalive on accepted connections (in the tree
# under tokio); tracing-subscriber for JSON logs; the Prometheus exporter for `/metrics`,
# without its own HTTP listener or push gateway.
clap = { version = "4.6.7", features = ["derive"] }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
socket2 = { version = "0.6.5", features = ["all"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std", "registry"] }
jsonschema = { version = "0.58.6", default-features = false }
# The MCP endpoint (ARCHITECTURE, MCP endpoint names it): rmcp's server over Streamable HTTP
# as a tower service the API mounts; its client only drives the endpoint in tests.
rmcp = { version = "3.5.1", default-features = false }
# The assistant's providers (ARCHITECTURE, Assistant): one JSON POST per model call over
# HTTPS. Auth also uses reqwest with rustls for identity-provider calls.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
jiff = { version = "0.2.38", default-features = false, features = ["serde", "std"] }
proptest = { version = "1.12.0", default-features = false, features = ["std", "bit-set"] }
schemars = { version = "1.2.2", features = ["jiff02"] }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "1.3.0"
serde_json = { version = "1.0", features = ["float_roundtrip"] }
serde_path_to_error = "0.1.20"
sha2 = "0.11.0"
# The store backends (ARCHITECTURE, Backends): Turso pinned exactly while pre-1.0, without its
# default allocator and full-text search; tokio for the Turso backend's pool alone. `turso` is
# the Rust SDK Turso documents for applications, and it re-exports its engine (`turso::core`),
# which the Turso backend's test seam names. It also builds Turso's two C-ABI crates as static
# and shared libraries that nothing links, about 450 MB a target directory
# (decisions/2026-10-08-turso-is-embedded-through-the-turso-crate.md). rustix, on Linux only,
# for the safe `posix_fadvise` the Turso backend evicts cached database pages with at open
# (already in the tree under other crates).
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }
tokio ={ version = "1.53.2", default-features = false }
turso = { version = "=0.8.2", default-features = false }
# The browser host (ARCHITECTURE, Web UI): the Rust half of the wasm bindings. Pinned exactly,
# because the `wasm-bindgen` CLI in mise.toml must be this same version to generate them.
wasm-bindgen = "=0.2.129"
# The patina SDK (PRACTICES, Simulation with patina), all at one revision: the same one
# `cargo-patina` is pinned to when the simulation track adds it to mise.toml. A crate opts
# in with `patina-dst.workspace = true`; until one does, cargo resolves none of them.
patina-dst = { git = "https://github.com/JacobHayes/patina", rev = "6a2977e7bce794d15eabaa18258a5542115bd872" }
patina-dst-harness = { git = "https://github.com/JacobHayes/patina", rev = "6a2977e7bce794d15eabaa18258a5542115bd872" }
patina-dst-proptest = { git = "https://github.com/JacobHayes/patina", rev = "6a2977e7bce794d15eabaa18258a5542115bd872" }

# Every crate inherits these with `[lints] workspace = true`; the lint step fails a crate that
# does not. The lints PRACTICES denies only in some crates (indexing and HashMap in the
# engine, panics in handlers) are raised per crate by the lint step (scripts/steps/lint), and
# clippy.toml holds the thresholds. That step also denies warnings, so pedantic fails it.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
too_many_lines = "deny"
unwrap_used = "deny"
# Configured in clippy.toml, raised to deny only for the engine by the lint step.
disallowed_types = "allow"

# Debug builds, and the test profile that inherits them: one setting for every crate, so
# `serve`, the tests and the checks share one set of artifacts. Optimized because the engine's
# property and cost tests, and the cases the browser tests compare with, took 5 to 50 s
# unoptimized; measured against optimizing only the computing crates, an engine edit's
# check:fast is no slower (103 s against 115 s). Debug assertions and overflow checks stay on.
# Line tables for the workspace's own crates, so panics and backtraces still name file and
# line, and no debug info for dependencies: with full debug info every test binary was
# hundreds of megabytes, each with its own copy of Turso's. Lower both locally to step through
# code in a debugger.
[profile.dev]
opt-level = 2
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The browser host's build (brief 4.5): the release profile, its symbols stripped and linked
# as one unit, so the module the page downloads is small. The wasm build task uses it for the
# release build and in CI (CAIRN_WASM_PROFILE=wasm); the link takes most of a minute.
[profile.release]
debug = true

[profile.wasm]
inherits = "release"
strip = true
lto = true
codegen-units = 1

# The browser host's build in the development loop (`mise run check`, `gen`, `serve`): no LTO
# and opt-level 1, so a change to the engine rebuilds the module in seconds, and stripped like
# the wasm profile. Stripping is what decides the bindings: it drops the module's target
# features section, without which wasm-bindgen binds through the stack instead of multiple
# return values, so both profiles generate the same web/wasm/generated/
# (decisions/2026-10-08-the-check-builds-the-wasm-module-without-lto.md).
[profile.wasm-dev]
inherits = "dev"
opt-level = 1
debug = false
strip = true
